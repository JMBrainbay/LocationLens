[project]
name = "nl-location-lens-api"
version = "0.1.0"
description = "Workshop starter API for Dutch location intelligence"
requires-python = ">=3.9"
dependencies = [
  "eval-type-backport>=0.3.0",
  "fastapi>=0.116.0",
  "httpx>=0.27.0",
  "mypy>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pytest>=8.3.0",
  "uvicorn>=0.32.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
